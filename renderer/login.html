<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>تسجيل الدخول - Smart POS</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body style="display:flex;align-items:center;justify-content:center;height:100vh;">
  <div class="card-box" style="width:360px;">
    <h2 style="text-align:center;color:var(--accent);line-height:1.5;">الإدارة العامة لشئون المجندين</h2>
    <p style="text-align:center;color:var(--text-dim);margin-top:-8px;">نظام نقطة البيع</p>
    <div class="form-row">
      <label>اسم المستخدم</label>
      <input id="username" autofocus />
    </div>
    <div class="form-row">
      <label>الرقم السري (PIN)</label>
      <input id="pin" type="password" />
    </div>
    <p id="errorMsg" style="color:var(--danger);display:none;"></p>
    <button class="primary" id="loginBtn">دخول</button>
  </div>
  <script src="login.js"></script>
</body>
</html>
