<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vintage Radio | Wedding Invitation</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/Draggable.min.js"></script>
    
    <!-- تم إضافة خط Playfair Display للفخامة والوضوح -->
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --wood-dark: #2A1610;
            --wood-light: #4A2B1E;
            --screen-bg: #1A1A10;
            --amber-glow: #FFB300;
            --paper-texture: #E8DCC4;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100vw; height: 100vh;
            background-color: #000;
            overflow: hidden; 
            font-family: 'Courier Prime', monospace;
            display: flex; align-items: center; justify-content: center;
        }

        .wallpaper-bg {
            position: absolute; 
            inset: -30px; 
            z-index: 1; 
            background-image: 
                radial-gradient(circle at center, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.95) 100%),
                url('https://images.unsplash.com/photo-1513519245088-0e12902e5a38?q=80&w=1920&auto=format&fit=crop'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            filter: blur(5px) sepia(0.6) brightness(0.6);
        }

        /* إضافة تأثير سطح المكتب (الترابيزة) تحت الراديو */
        .desk-surface {
            position: absolute;
            bottom: 0; left: 0; width: 100%; height: 35vh;
            background: linear-gradient(to bottom, rgba(20, 10, 5, 0.8), rgba(0, 0, 0, 1));
            z-index: 2;
            box-shadow: 0 -20px 50px rgba(0,0,0,0.9);
        }

        .radio-body {
            width: 95vw; max-width: 500px;
            min-height: 400px; height: 65vh; max-height: 600px;
            background: linear-gradient(135deg, var(--wood-light), var(--wood-dark));
            border-radius: 15px;
            box-shadow: 
                inset 0 0 20px rgba(0,0,0,0.8),
                0 40px 50px rgba(0,0,0,0.95), /* ظل أثقل لإبراز الواقعية */
                0 0 0 8px #1a0f0a;
            position: relative;
            z-index: 10; 
            padding: 15px;
            display: flex; flex-direction: column; justify-content: space-between;
        }

        @keyframes blink-red {
            0%, 100% { opacity: 1; box-shadow: 0 0 15px 2px rgba(255, 0, 0, 0.9); background-color: #ff2222; }
            50% { opacity: 0.3; box-shadow: 0 0 2px 0px rgba(255, 0, 0, 0.5); background-color: #880000; }
        }
        .status-light { animation: blink-red 2s infinite ease-in-out; }

        .speaker-grill {
            background-image: radial-gradient(#111 20%, transparent 20%), radial-gradient(#111 20%, transparent 20%);
            background-position: 0 0, 4px 4px;
            background-size: 8px 8px;
            background-color: #2c1a11;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
            flex-shrink: 0;
        }

        .radio-screen {
            background-color: var(--screen-bg);
            border: 4px solid #111;
            border-radius: 10px;
            box-shadow: inset 0 0 30px rgba(255, 179, 0, 0.15);
            position: relative;
            overflow: hidden;
            flex-grow: 1;
            margin: 15px 0;
        }

        .scanlines {
            position: absolute; inset: 0; z-index: 10;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.15) 50%, rgba(0,0,0,0.15));
            background-size: 100% 4px;
            pointer-events: none;
        }

        /* تم تخفيف التوهج لزيادة وضوح القراءة */
        .amber-text {
            color: var(--amber-glow);
            text-shadow: 0 0 3px rgba(255, 179, 0, 0.8), 0 0 15px rgba(255, 179, 0, 0.4);
        }

        /* خط أنيق وواضح جداً للأسماء */
        .font-elegant { font-family: 'Playfair Display', serif; font-style: italic; }

        .knob {
            width: 50px; height: 50px;
            background: radial-gradient(circle at 30% 30%, #555, #111);
            border-radius: 50%;
            border: 2px solid #000;
            box-shadow: 0 5px 10px rgba(0,0,0,0.8), inset 0 0 5px rgba(255,255,255,0.3);
            position: relative; cursor: pointer;
            margin: 0 auto;
        }
        .knob-marker {
            position: absolute; top: 4px; left: 50%;
            transform: translateX(-50%);
            width: 3px; height: 10px;
            background-color: #fff; border-radius: 2px;
        }

        .tuning-needle {
            position: absolute; top: 0; bottom: 0; left: 10%;
            width: 2px; background-color: #ff3300;
            box-shadow: 0 0 8px #ff3300;
            z-index: 5;
        }

        #start-overlay {
            position: fixed; inset: 0; z-index: 50; 
            background: #000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        .station-content { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; padding: 10px; }
        .station-active { opacity: 1; z-index: 2; }

        /* أنيميشن الدوران للتوجيه */
        @keyframes slow-spin { 
            from { transform: rotate(0deg); } 
            to { transform: rotate(360deg); } 
        }
        .animate-slow-spin { animation: slow-spin 4s linear infinite; }
    </style>
</head>

<body>
    <div class="wallpaper-bg"></div>
    <div class="desk-surface"></div> <!-- سطح الطاولة لواقعية أكثر -->

    <div id="start-overlay">
        <div id="intro-text" class="text-center">
            <h1 class="font-elegant text-3xl md:text-5xl mb-8 text-gray-400 opacity-80">Find The Frequency</h1>
            <button id="power-btn" class="px-8 py-3 border border-gray-600 text-gray-400 hover:border-[#E8DCC4] hover:text-[#E8DCC4] transition-all tracking-[0.2em] uppercase text-xs md:text-sm">
                Touch to Tune In
            </button>
        </div>
    </div>

    <div class="radio-body opacity-0 scale-90" id="radio-system">
        
        <div class="absolute top-4 right-4 w-3 h-3 rounded-full border border-black status-light z-20"></div>
        
        <div class="w-full h-16 md:h-20 speaker-grill rounded-md flex items-center justify-center">
            <div class="w-12 h-12 rounded-full border-4 border-[#111] opacity-30"></div>
        </div>

        <div class="radio-screen flex items-center p-2 md:p-4">
            <div class="scanlines"></div>
            
            <div class="absolute top-2 w-full flex justify-between text-[8px] md:text-[10px] text-gray-500 px-4 md:px-6 font-bold z-10">
                <span>88</span><span>92</span><span>96</span><span>100</span><span>104</span><span>108</span>
            </div>
            
            <div class="tuning-needle" id="needle"></div>

            <div class="station-content station-active w-full text-center" id="station-1">
                <p class="text-[9px] md:text-xs text-gray-400 tracking-[0.2em] mb-1 md:mb-2 uppercase">Frequency of Love</p>
                <h2 class="font-elegant text-4xl md:text-5xl amber-text">Ahmed</h2>
                <span class="text-lg amber-text mx-2 opacity-60 font-sans">&</span>
                <h2 class="font-elegant text-4xl md:text-5xl amber-text">Noura</h2>
            </div>

            <div class="station-content w-full text-center" id="station-2">
                <p class="text-[9px] md:text-[10px] text-gray-400 tracking-[0.2em] mb-2 uppercase">Transmission Time</p>
                <p class="text-xl md:text-3xl amber-text font-bold tracking-widest font-elegant">03 . 07 . 2026</p>
                <p class="text-xs md:text-sm amber-text mt-2 tracking-widest">7:30 PM</p>
            </div>

            <div class="station-content w-full text-center" id="station-3">
                <p class="text-[9px] md:text-[10px] text-gray-400 tracking-[0.2em] mb-2 uppercase">Broadcast Location</p>
                <p class="text-2xl md:text-3xl amber-text px-2 font-elegant">The Grand Ballroom</p>
                <a href="https://maps.google.com" target="_blank" class="pointer-events-auto mt-4 px-6 py-2 border border-[#FFB300] amber-text text-[10px] md:text-xs tracking-widest hover:bg-[#FFB300] hover:text-[#111] transition-colors inline-block z-20 relative">Open Location</a>
            </div>
        </div>

        <div class="w-full flex justify-between items-end px-2 md:px-4 pb-2 relative">
            
            <!-- بكرة الصوت -->
            <div class="text-center w-1/3">
                <div class="knob" id="volume-knob"><div class="knob-marker"></div></div>
                <p class="text-[#E8DCC4] text-[8px] md:text-[10px] mt-2 tracking-widest">VOLUME</p>
            </div>
            
            <div class="text-center w-1/3 pb-2">
                <div class="text-[#E8DCC4] text-[10px] md:text-xs font-elegant mb-2 opacity-70">"The Premiere"</div>
                <div class="w-12 md:w-16 h-1 bg-[#111] mx-auto rounded"></div>
            </div>

            <!-- بكرة البحث مع التوجيه البصري -->
            <div class="text-center w-1/3 relative">
                <!-- الدليل البصري (Affordance) للمستخدم -->
                <div class="absolute -top-8 left-1/2 transform -translate-x-1/2 w-full flex flex-col items-center opacity-80 pointer-events-none">
                    <span class="text-[#FFB300] text-[8px] tracking-widest uppercase mb-1">Turn to Discover</span>
                    <i class="fa-solid fa-rotate-right text-[#FFB300] text-sm animate-slow-spin"></i>
                </div>

                <div class="knob" id="tuning-knob"><div class="knob-marker"></div></div>
                <p class="text-[#E8DCC4] text-[8px] md:text-[10px] mt-2 tracking-widest">TUNE</p>
            </div>
        </div>
    </div>

    <audio id="vintage-audio" loop>
        <source src="music/Video Project 2.m4a" type="audio/mp4">
    </audio>
    <audio id="static-audio" loop>
        <source src="https://assets.mixkit.co/sfx/preview/mixkit-radio-static-hiss-1361.mp3" type="audio/mpeg">
    </audio>

    <script>
        gsap.registerPlugin(Draggable);

        const powerBtn = document.getElementById('power-btn');
        const introText = document.getElementById('intro-text');
        const startOverlay = document.getElementById('start-overlay');
        const radioSystem = document.getElementById('radio-system');
        const vintageAudio = document.getElementById('vintage-audio');
        const staticAudio = document.getElementById('static-audio');
        const needle = document.getElementById('needle');
        
        const stations = [
            document.getElementById('station-1'),
            document.getElementById('station-2'),
            document.getElementById('station-3')
        ];

        let currentStation = 0;

        powerBtn.addEventListener('click', () => {
            gsap.to(introText, { opacity: 0, duration: 0.3 });
            
            staticAudio.volume = 0.8;
            staticAudio.play().catch(e => console.log(e));

            setTimeout(() => {
                vintageAudio.volume = 0.7;
                vintageAudio.play().catch(e => console.log(e));

                gsap.to(staticAudio, { volume: 0.15, duration: 1 });
                
                gsap.to(startOverlay, { opacity: 0, duration: 1, onComplete: () => startOverlay.style.display = 'none' });
                gsap.to(radioSystem, { opacity: 1, scale: 1, duration: 1.5, ease: "back.out(1.2)" });
            }, 1500);
        });

        Draggable.create("#tuning-knob", {
            type: "rotation",
            bounds: { minRotation: 0, maxRotation: 360 },
            ignore: ".pointer-events-auto",
            onDrag: function() {
                let progress = this.rotation / 360;
                let needlePos = 10 + (progress * 80);
                gsap.set(needle, { left: `${needlePos}%` });

                let newStation;
                if (progress < 0.33) newStation = 0;
                else if (progress < 0.66) newStation = 1;
                else newStation = 2;

                if (newStation !== currentStation) {
                    gsap.to(staticAudio, { volume: 0.6, duration: 0.2, yoyo: true, repeat: 1 });
                    gsap.to(vintageAudio, { volume: 0.3, duration: 0.2, yoyo: true, repeat: 1 });
                    
                    gsap.to(stations[currentStation], { opacity: 0, zIndex: 1, duration: 0.3 });
                    gsap.to(stations[newStation], { opacity: 1, zIndex: 2, duration: 0.3, delay: 0.2 });
                    
                    currentStation = newStation;
                }
            }
        });

        Draggable.create("#volume-knob", {
            type: "rotation",
            bounds: { minRotation: 0, maxRotation: 270 },
            onDrag: function() {
                let volProgress = this.rotation / 270;
                vintageAudio.volume = volProgress;
                staticAudio.volume = Math.max(0, 0.3 - (volProgress * 0.2)); 
            }
        });
        
        gsap.set("#volume-knob", { rotation: 190 });
    </script>
</body>
</html>
